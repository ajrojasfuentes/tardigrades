[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tardigrades"
version = "0.1.0-alpha"
description = "Pandas-like interface for PyTorch tensors with native multidimensional support."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "Tu Nombre", email = "tu@email.com"},
]
dependencies = [
  "torch>=2.0.0",
  "pandas>=2.0.0",  # Usaremos Pandas solo para gestionar los índices internamente
  "numpy"
]

[project.urls]
Homepage = "https://gitlab.com/tu-usuario/tardigrades" # O donde lo alojes

[tool.hatch.build.targets.wheel]
packages = ["src/tardigrades"]